<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0d0d" />
    <title>请替我沉默 · 可玩 Demo</title>
    <link rel="stylesheet" href="css/style.css?v=runtime-split-1" />
  </head>
  <body>
    <main id="app" class="app is-loading is-title-screen">
      <section id="stage" class="stage" aria-label="请替我沉默可玩场景">
        <div class="scene-page-layer" aria-hidden="true">
          <img id="scene-page" class="scene-page" alt="" />
        </div>
        <div id="story-video-layer" class="story-video-layer is-hidden" aria-hidden="true">
          <video id="story-video" class="story-video" muted playsinline preload="auto"></video>
          <div id="story-video-caption" class="story-video-caption" aria-live="polite"></div>
          <button id="story-video-skip" class="story-video-skip is-hidden" type="button">跳过反转</button>
        </div>
        <div class="stage-shade" aria-hidden="true"></div>
        <div class="stage-grain" aria-hidden="true"></div>
        <div class="bgm-audio" aria-hidden="true">
          <audio id="bgm-a" preload="metadata"></audio>
          <audio id="bgm-b" preload="metadata"></audio>
        </div>

        <section id="title-screen" class="title-screen" aria-label="游戏开始" aria-busy="true">
          <div class="title-screen-wash" aria-hidden="true"></div>
          <div class="title-content">
            <p id="title-kicker" class="title-kicker">K/S · 01</p>
            <div class="title-rule" aria-hidden="true"></div>
            <h1 id="title-game-name">请替我沉默</h1>
            <p id="title-latin-name" class="title-english">KEEP SILENT FOR ME</p>
            <p id="title-tagline" class="title-tagline">她负责说谎，你负责活下来。</p>
            <div class="title-actions">
              <button id="title-primary" class="text-button title-primary" type="button" disabled>开始游戏</button>
              <button id="title-new-game" class="title-secondary is-hidden" type="button">重新开始</button>
            </div>
            <label class="title-language" for="title-language-select">
              <span id="title-language-label">语言</span>
              <select id="title-language-select" disabled></select>
            </label>
            <p id="title-status" class="title-status" role="status" aria-live="polite">正在准备场景…</p>
          </div>
        </section>

        <header class="topbar">
          <div class="wordmark">
            <span class="wordmark-mark">K/S</span>
            <span id="wordmark-name" class="wordmark-name">请替我沉默</span>
          </div>
          <div class="chapter-readout">
            <span id="chapter-kicker">开场</span>
            <span class="readout-divider">/</span>
            <span id="chapter-title">雨窗里的第一句话</span>
          </div>
          <div class="topbar-actions">
            <div class="language-menu-wrap">
              <button id="language-menu-button" class="language-menu-button" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="language-menu" disabled>简体中文</button>
              <div id="language-menu" class="language-menu is-hidden" role="menu" aria-label="切换语言"></div>
            </div>
            <button id="restart-button" class="icon-button" type="button" aria-label="重新开始" title="重新开始">↺</button>
            <button id="audio-settings-button" class="icon-button" type="button" aria-label="打开音乐调节" title="音乐调节" aria-controls="audio-settings" aria-expanded="false">⚙</button>
            <button id="sound-button" class="icon-button" type="button" aria-label="切换提示音和配乐" title="切换提示音和配乐">◌</button>
          </div>
        </header>

        <aside id="audio-settings" class="audio-settings is-hidden" role="dialog" aria-modal="true" aria-labelledby="audio-settings-title" aria-describedby="audio-settings-status">
          <div class="audio-settings-head">
            <div>
              <p id="audio-settings-eyebrow" class="audio-settings-eyebrow">声音设置</p>
              <h2 id="audio-settings-title">音乐调节</h2>
            </div>
            <button id="audio-settings-close" class="icon-button audio-settings-close" type="button" aria-label="关闭音乐调节" title="关闭音乐调节">×</button>
          </div>
          <label class="audio-enabled-row" for="audio-enabled">
            <span class="audio-enabled-copy">
              <span id="audio-control-label" class="audio-control-label">声音</span>
              <span id="audio-enabled-status" class="audio-control-note">配乐与提示音开启</span>
            </span>
            <input id="audio-enabled" class="audio-switch" type="checkbox" checked aria-describedby="audio-enabled-status" />
          </label>
          <div class="audio-range-control">
            <div class="audio-range-head">
              <label id="music-volume-label" for="music-volume">配乐</label>
              <output id="music-volume-value" for="music-volume" aria-live="polite">100%</output>
            </div>
            <input id="music-volume" type="range" min="0" max="100" step="1" value="100" aria-labelledby="music-volume-label" aria-valuetext="100%" />
          </div>
          <div class="audio-range-control">
            <div class="audio-range-head">
              <label id="sfx-volume-label" for="sfx-volume">提示音</label>
              <output id="sfx-volume-value" for="sfx-volume" aria-live="polite">100%</output>
            </div>
            <input id="sfx-volume" type="range" min="0" max="100" step="1" value="100" aria-labelledby="sfx-volume-label" aria-valuetext="100%" />
          </div>
          <p id="audio-settings-status" class="audio-settings-status">当前配乐 · 等待载入</p>
        </aside>

        <aside class="scene-status" aria-live="polite">
          <div id="status-caption" class="status-caption">当前状态</div>
          <div id="status-copy" class="status-copy">等待她把一句话交给你。</div>
          <div class="status-rule" aria-hidden="true"><span id="status-rule-fill"></span></div>
          <div id="scene-caption" class="scene-caption">场景页 · 尚未载入</div>
        </aside>

        <aside id="live-chat" class="live-chat is-hidden" role="log" aria-live="polite" aria-label="直播滚屏">
          <div class="live-chat-head">
            <span class="live-chat-live"><span class="live-chat-dot" aria-hidden="true"></span>LIVE</span>
            <span id="live-chat-viewers">观众 1,204</span>
          </div>
          <div class="live-chat-viewport">
            <div id="live-chat-track" class="live-chat-track"></div>
          </div>
        </aside>

        <section id="dialogue-frame" class="dialogue-frame" aria-label="台词">
          <img class="dialogue-skin" src="../art/v4/playable/ui/UI_dialog.png" alt="" aria-hidden="true" />
          <div class="dialogue-content">
            <div class="dialogue-meta">
              <span id="speaker-name">她</span>
              <span id="line-id" class="line-id">L0_S01</span>
            </div>
            <div id="memory-echo" class="memory-echo is-hidden" aria-live="polite"></div>
            <div id="dialogue-text" class="dialogue-text" aria-live="polite"></div>
            <div id="dialogue-zones" class="dialogue-zones" aria-hidden="true"></div>
            <div class="dialogue-footer">
              <span id="feedback-copy">黑条停在句子外。</span>
              <span id="zone-count" class="zone-count">04</span>
            </div>
          </div>
        </section>

        <div id="drag-layer" class="drag-layer" aria-hidden="true">
          <div id="zone-halo" class="zone-halo"></div>
          <img id="black-bar" class="black-bar bar-hover" src="../art/v4/playable/ui/UI_bar_hover.png" alt="" draggable="false" />
        </div>

        <div id="fx-layer" class="fx-layer" aria-hidden="true"></div>
        <div id="toast" class="toast" role="status" aria-live="polite"></div>

        <section id="chapter-overlay" class="chapter-overlay is-hidden" role="dialog" aria-modal="true" aria-live="polite" aria-labelledby="overlay-title" aria-describedby="overlay-copy">
          <div class="overlay-rule" aria-hidden="true"></div>
          <p id="overlay-eyebrow" class="overlay-eyebrow">段落结束</p>
          <h1 id="overlay-title">雨声没有停</h1>
          <p id="overlay-copy">她还在等下一句。</p>
          <button id="overlay-action" class="text-button" type="button">继续</button>
        </section>

        <section id="memory-overlay" class="memory-overlay is-hidden" role="dialog" aria-live="polite" aria-modal="true" aria-labelledby="memory-title" aria-describedby="memory-copy">
          <div class="memory-panel">
            <div class="overlay-rule" aria-hidden="true"></div>
            <p id="memory-eyebrow" class="overlay-eyebrow">语言胃</p>
            <h1 id="memory-title">你吞下的字还没有沉下去</h1>
            <p id="memory-copy" class="memory-copy">把它们收拢成一句只留给自己的私语。</p>
            <div class="memory-section">
              <div id="memory-fragments-label" class="memory-label">碎片</div>
              <div id="memory-pool" class="memory-pool" aria-label="私语碎片"></div>
            </div>
            <div class="memory-section">
              <div id="memory-whisper-label" class="memory-label">私语</div>
              <div id="memory-lane" class="memory-lane" aria-label="排列后的私语"></div>
            </div>
            <button id="memory-confirm" class="text-button memory-confirm" type="button" disabled>收好这句私语</button>
          </div>
        </section>

        <div id="error-panel" class="error-panel is-hidden" role="alert">
          <strong id="error-title">场景暂时无法载入。</strong>
          <span id="error-copy">请通过本地服务器打开 Demo。</span>
          <button id="retry-button" class="text-button" type="button">重试</button>
        </div>
      </section>
    </main>
    <!-- Classic scripts are intentionally ordered: each chunk exposes the
         helpers consumed by the chunks that follow it. -->
    <script src="js/runtime/00-config-dom-state.js?v=runtime-split-1"></script>
    <script src="js/runtime/10-locale.js?v=runtime-split-1"></script>
    <script src="js/runtime/20-video.js?v=runtime-split-1"></script>
    <script src="js/runtime/30-audio.js?v=runtime-split-1"></script>
    <script src="js/runtime/40-runtime-state-chat.js?v=runtime-split-1"></script>
    <script src="js/runtime/50-dialogue-drag.js?v=runtime-split-1"></script>
    <script src="js/runtime/60-memory.js?v=runtime-split-1"></script>
    <script src="js/runtime/70-flow.js?v=runtime-split-1"></script>
    <script src="js/runtime/80-init.js?v=runtime-split-1"></script>
    <script src="js/main.js?v=runtime-split-1"></script>
  </body>
</html>
