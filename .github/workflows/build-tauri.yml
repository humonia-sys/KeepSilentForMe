name: Build Tauri desktop packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-22.04
            bundles: appimage,deb
          - platform: windows
            runner: windows-latest
            # Keep the Windows artifact on the NSIS path. MSI uses the WiX
            # toolchain and can fail independently on a hosted runner.
            bundles: nsis

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.8"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.88.0

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils ffmpeg

      - name: Install ffmpeg (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: choco install ffmpeg -y --no-progress

      - name: Install frontend and Tauri dependencies
        run: npm ci

      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input Pillow

      - name: Validate source assets
        run: |
          npm run validate:runtime-js
          node scripts/validate-chapters.mjs
          node scripts/validate-locales.mjs
          node scripts/validate-audio.mjs
          node scripts/validate-runtime-videos.mjs
          python3 art/v4/scenes/validate.py
          python3 art/v4/playable/validate.py

      - name: Print Windows build tool versions
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          node --version
          npm --version
          rustc --version
          cargo --version

      - name: Build desktop bundles
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGOFLAGS: --locked
        with:
          tauriScript: npm run tauri
          args: --bundles ${{ matrix.bundles }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: keep-silent-for-me-${{ matrix.platform }}-[arch]-[bundle]
          uploadUpdaterJson: false
          uploadUpdaterSignatures: false

      - name: Stage portable files (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $release = "src-tauri\target\release"
          $exe = Get-ChildItem $release -Filter *.exe -File | Select-Object -First 1
          if (-not $exe) { throw "release exe 未找到: $release" }
          Copy-Item $exe.FullName (Join-Path $env:GITHUB_WORKSPACE $exe.Name)
          Get-ChildItem $release -Filter WebView2Loader.dll -File | ForEach-Object {
            Copy-Item $_.FullName (Join-Path $env:GITHUB_WORKSPACE $_.Name)
          }

      - name: Upload portable zip (Windows)
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v7
        with:
          name: keep-silent-for-me-windows-x64-portable
          # 只传 exe（+可选 WebView2Loader.dll），artifact 下载即为 zip，文件平铺在根，
          # 避免「zip 里套 zip」的嵌套。
          path: |
            keep-silent-for-me*.exe
            WebView2Loader.dll
          if-no-files-found: warn
