name: Deploy game to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.8"

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 -m pip install --disable-pip-version-check --no-input Pillow

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Validate source assets
        run: |
          npm run validate:runtime-js
          node scripts/validate-chapters.mjs
          node scripts/validate-locales.mjs
          node scripts/validate-audio.mjs
          node scripts/validate-runtime-videos.mjs
          python3 art/v4/scenes/validate.py
          python3 art/v4/playable/validate.py

      - name: Assemble Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/web _site/art/bg _site/art/v4/playable _site/art/v4/scenes _site/script
          cp -a web/. _site/web/
          cp -a art/bg/. _site/art/bg/
          cp -a art/v4/playable/. _site/art/v4/playable/
          cp -a art/v4/scenes/. _site/art/v4/scenes/
          cp -a script/. _site/script/
          touch _site/.nojekyll

      - name: Verify Pages artifact
        env:
          SITE_ROOT: _site
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["SITE_ROOT"])
          required = [
              root / "web/index.html",
              root / "web/js/main.js",
              root / "web/audio/manifest.json",
              root / "web/video/manifest.json",
              root / "art/v4/playable/manifest.json",
              root / "art/v4/scenes/manifest.json",
              root / "script/chapters.json",
              root / "script/locales/manifest.json",
              root / "script/locales/zh-CN.json",
              root / "script/locales/en.json",
              root / "script/locales/de.json",
              root / "script/locales/ru.json",
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f"missing required Pages files: {missing}")

          playable = json.loads((root / "art/v4/playable/manifest.json").read_text())
          playable_missing = [
              asset["path"]
              for asset in playable["assets"]
              if not (root / "art/v4/playable" / asset["path"]).is_file()
          ]
          if playable_missing:
              raise SystemExit(f"missing playable assets: {playable_missing}")

          background_missing = [
              path
              for path in playable.get("backgrounds", {}).values()
              if not (root / "art/v4/playable" / path).is_file()
          ]
          if background_missing:
              raise SystemExit(f"missing legacy backgrounds: {background_missing}")

          pages = json.loads((root / "art/v4/scenes/manifest.json").read_text())
          page_missing = [
              asset["path"]
              for asset in pages["assets"]
              if not (root / "art/v4/scenes" / asset["path"]).is_file()
          ]
          if page_missing:
              raise SystemExit(f"missing scene pages: {page_missing}")

          audio = json.loads((root / "web/audio/manifest.json").read_text())
          audio_missing = [
              track["path"]
              for track in audio["tracks"]
              if not (root / "web/audio" / track["path"]).is_file()
          ]
          if audio_missing:
              raise SystemExit(f"missing audio assets: {audio_missing}")

          runtime_videos = json.loads((root / "web/video/manifest.json").read_text())
          video_missing = []
          all_video_sequences = [
              *runtime_videos.get("sequences", {}).values(),
              *runtime_videos.get("chapterOutros", {}).values(),
          ]
          for sequence in all_video_sequences:
              for clip in sequence.get("clips", []):
                  path = root / "web/video" / clip["path"]
                  if not path.is_file() or path.stat().st_size == 0:
                      video_missing.append(str(path))
          if video_missing:
              raise SystemExit(f"missing runtime video assets: {video_missing}")

          print(
              f"Pages artifact OK: {len(playable['assets'])} playable assets, "
              f"{len(pages['assets'])} scene pages, {len(audio['tracks'])} audio tracks, "
              f"{sum(len(sequence.get('clips', [])) for sequence in all_video_sequences)} video clips"
          )
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
